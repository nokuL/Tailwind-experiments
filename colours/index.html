<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
<div class="flex items-center justify-center h-screen text-red-400 bg-gray-300">
    <!--card-->
    <div class="bg-gray-800 p-2 mx-6 rounded-2xl">
        <div class="flex flex-col md:flex-row rounded-l-xl">
            <img src="../images/image.jpg"
            alt="" class="object-fit rounded-xl h-80 md:h-64 md:rounded-l-xl md:rounded-r-none transform hover:scale-105 hover: rounder-xl duration-200"/>
            <div class="p-6 md:p-12">
                <h2 class="font-serif text-xl font-medium text-center text-white md:text-left">Get diet and fitness tips in your inbox</h2>
                <p class="max-w-xs my-4 text-xs leading-5 tracking-wide text-center text-white md:text-left"> Eat better and exercise better. Signup for a better experience</p>
                
                <div class="flex flex-col  mt-5 space-y-4 md:space-x-3 md:flex-row md:space-y-0">
                    <input class="p-2 px-4 text-center bg-gray-700 text-white " placeholer="Enter your email" type="text"
                    placeholder:text-xs placeholder:text-center md:text-left placeholder:md:text-left focus:outline-none/>
    
                    <button class="px-5 py-3 text-xs text-gray-600 
                    rounded-md bg-green-400 hover:bg-green-700 hover:text-white" >Subscribe</button>
    
                </div>
            </div>
                
            </div>
          

        </div>
        </div>
    
</div>

</body>
</html>
