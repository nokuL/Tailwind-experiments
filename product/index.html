<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body>
    <div class="flex items-center justify-center bg-gray-200 h-screen">
        <!--card-->
        <div class="flex flex-col p-8 space-y-10 bg-white rounded-2xl shadow-2xl shadow-lg-blue-800 mt-3
         md:flex-row md:p-16 md:space-y-0 md:space-x-10"> 
         <div> <img alt="product" src="../images/product-modal/images/headphone.png" 
            class="object-fit  w-60 transform hover:scale-105 mx-auto"/>
        </div>
        <!--Contente-->           
            <div class="flex flex-col space-y-6">
                <!--Label and description container-->
                <div class="flex flex-col mb-4 space-y-3 text-center md:text-left">
                    <div>
                    <div class="inline-block bg-black rounded-full text-white text-sm  py-1 px-3">Free shipping!</div>
                </div>
                </div>
                <!--Description-->
                <div class="max-w-sm font-medium text-center text-3xl">Gaming Headset Quartz</div>
                <!--price-->
                <div class="flex flex-col space-y-3 mb-4 text-center md:text-left">
                    <p class="line-through text-sm">$799</p>
                    <p class="text-5xl font-bold">$500</p>
                    <p class="text-sm text-gray-400 font-light">The offer is available until 3 April 2024</p>
                </div>
                <!--Button group-->
                <div class="group">
                    <button class="w-full bg-blue-700 text-white  rounded-lg border-b-8 border-b-blue-700 
                    group-hover:border-t-8 group-hover:border-b-0 group-hover:bg-blue-700">
                        <div class="px-8 py-4 bg-blue-500 rounded-lg">
                        Add to cart
                        </div>
                    </button>
                </div>
                <!--STock-->
                <div class="flex items-center space-x-3 group">
                    <div class="w-3 h-3 bg-green-400 rounded-full group-hover: transform animate-ping"></div>
                    <div class="text-sm">50+ pcs. in stock</div>

                </div>
                <!--Bottom buttons container-->
                <div class="flex flex-col space-y-4 md:flex-row md:space-y-0 md:space-x-4">
                    <button class="flex items-center justify-center py-3 px-5
                     space-x-2 border-gray-300 border-2 rounded-lg shadow-sm hover:bg-opacity-30 hover:shadow-xl
                      hover:-translate-y-0.5 transition-all duration-150" >
                        <img src="../images/product-modal/images/weight.png" alt="" class="w-8"/>
                        <span>Add To Cart</span>
                    </button>
                    <button class="flex items-center justify-center py-3 px-5
                    space-x-2 border-gray-300 border-2 rounded-lg shadow-sm hover:bg-opacity-30 hover:shadow-xl
                     hover:-translate-y-0.5 transition-all duration-150" >
                       <img src="../images/product-modal/images/heart.png" alt="" class="w-8"/>
                       <span>Add To Wishlist</span>
                   </button>
                </div>
             

            </div>

        </div>
    </div>
</body>
</html>
